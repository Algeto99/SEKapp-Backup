<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Morning Briefing — Kanan Sentinel</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:'Inter',sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh;display:flex}

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
.sidebar{width:220px;min-height:100vh;background:#0f172a;display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:40;overflow-y:auto;transition:transform 0.3s ease}
.sidebar.collapsed{transform:translateX(-100%)}
.sidebar-logo{padding:1.5rem 1.25rem 1rem;border-bottom:1px solid rgba(255,255,255,0.07)}
.sidebar-logo img{width:160px;display:block;margin:0 auto}
.sidebar-nav{padding:1rem 0;flex:1}
.nav-section{padding:.5rem 1.25rem .25rem;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#475569}
.nav-item{display:flex;align-items:center;gap:.625rem;padding:.625rem 1.25rem;color:#94a3b8;text-decoration:none;font-size:.8125rem;font-weight:500;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{color:#e2e8f0;background:rgba(255,255,255,0.05)}
.nav-item.active{color:#38bdf8;background:rgba(56,189,248,0.08);border-left-color:#38bdf8}
.nav-item svg{width:15px;height:15px;flex-shrink:0}
.nav-divider{border:none;border-top:1px solid rgba(255,255,255,0.07);margin:.5rem 1.25rem}
.sidebar-footer{padding:1rem 1.25rem;border-top:1px solid rgba(255,255,255,0.07)}
.sidebar-user{font-size:.75rem;color:#64748b;word-break:break-all}
.sidebar-user strong{color:#94a3b8;display:block;margin-bottom:.25rem}
.btn-logout{display:block;margin-top:.75rem;padding:.5rem .75rem;background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.25);border-radius:.5rem;font-size:.75rem;text-align:center;text-decoration:none;font-weight:600;transition:all .15s}
.btn-logout:hover{background:rgba(239,68,68,0.2)}

/* ── Layout ──────────────────────────────────────────────────────────────── */
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh;transition:margin-left 0.3s ease;min-width:0;overflow-x:hidden}
.main.expanded{margin-left:0}
.topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:.875rem 1.75rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem;position:sticky;top:0;z-index:30;min-width:0;overflow:hidden}
.topbar-left{display:flex;align-items:center;gap:.875rem;min-width:0;flex:1}
.page-icon{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#f59e0b,#f97316);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.page-icon svg{width:22px;height:22px;color:#fff}
.page-title{font-size:1.0625rem;font-weight:700;color:#0f172a;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-subtitle{font-size:.78rem;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.auto-refresh-badge{display:flex;align-items:center;gap:.375rem;font-size:.75rem;color:#64748b;background:#f8fafc;border:1px solid #e2e8f0;border-radius:999px;padding:.25rem .625rem;white-space:nowrap}
.auto-refresh-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}
.auto-refresh-dot.updating{background:#f59e0b;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-ver-operacion{height:34px;padding:0 .875rem;background:#0f172a;color:#fff;border:none;border-radius:.5rem;font-size:.78rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.375rem;transition:background .15s;flex-shrink:0;white-space:nowrap}
.btn-ver-operacion:hover{background:#1e293b}

.content{padding:1.5rem 1.75rem;flex:1;max-width:1200px;min-width:0;width:100%;overflow-x:hidden}

/* ── Skeleton loaders ────────────────────────────────────────────────────── */
.skeleton{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:400px 100%;animation:shimmer 1.2s infinite;border-radius:.375rem}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.sk-line{display:block;height:1rem;margin-bottom:.5rem}
.sk-val{display:block;height:2.5rem;width:5rem}
.sk-full{display:block;height:1rem;width:100%}

/* ── Sección 1 — Saludo ──────────────────────────────────────────────────── */
.greeting-section{margin-bottom:1.5rem}
.greeting-title{font-size:1.5rem;font-weight:700;color:#0f172a;font-family:'Merriweather',serif;line-height:1.3;word-break:break-word}
.greeting-sub{font-size:.875rem;color:#64748b;margin-top:.375rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.greeting-chip{display:inline-flex;align-items:center;gap:.375rem;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:999px;padding:.2rem .625rem;font-size:.75rem;font-weight:600;white-space:nowrap}

/* ── Sección 2 — Semáforo Global ─────────────────────────────────────────── */
.semaforo-global{display:flex;align-items:center;gap:1.25rem;border-radius:1rem;padding:1.25rem 1.5rem;margin-bottom:1.25rem;cursor:pointer;transition:filter .15s;border:1.5px solid transparent;user-select:none}
.semaforo-global:hover{filter:brightness(.97)}
.semaforo-global.sg-verde{background:#f0fdf4;border-color:#86efac}
.semaforo-global.sg-amarillo{background:#fffbeb;border-color:#fde68a}
.semaforo-global.sg-rojo{background:#fef2f2;border-color:#fecaca}
.sg-luz-wrap{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.sg-luz{width:22px;height:22px;border-radius:50%;opacity:.2;transition:opacity .3s,box-shadow .3s}
.sg-luz-rojo{background:#ef4444}
.sg-luz-amarillo{background:#f59e0b}
.sg-luz-verde{background:#22c55e}
.sg-luz.activo{opacity:1}
.sg-luz-rojo.activo{box-shadow:0 0 12px 3px rgba(239,68,68,.5)}
.sg-luz-amarillo.activo{box-shadow:0 0 12px 3px rgba(245,158,11,.5)}
.sg-luz-verde.activo{box-shadow:0 0 12px 3px rgba(34,197,94,.5)}
.sg-body{flex:1;min-width:0}
.sg-estado{font-size:1.125rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;line-height:1.2}
.semaforo-global.sg-verde  .sg-estado{color:#15803d}
.semaforo-global.sg-amarillo .sg-estado{color:#92400e}
.semaforo-global.sg-rojo   .sg-estado{color:#b91c1c}
.sg-meta{font-size:.8rem;margin-top:.25rem;font-weight:500}
.semaforo-global.sg-verde  .sg-meta{color:#166534}
.semaforo-global.sg-amarillo .sg-meta{color:#78350f}
.semaforo-global.sg-rojo   .sg-meta{color:#7f1d1d}
.sg-hint{font-size:.72rem;margin-top:.125rem;opacity:.55}
.sg-arrow{flex-shrink:0;opacity:.4}

/* Semáforo skeleton */
.semaforo-skeleton{border-radius:1rem;padding:1.25rem 1.5rem;margin-bottom:1.25rem;background:#fff;border:1px solid #e2e8f0;display:flex;align-items:center;gap:1.25rem}

/* ── Sección 3 — KPI Grid 2×2 ───────────────────────────────────────────── */
.kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-bottom:1.25rem}
.kpi-card{background:#fff;border:1px solid #e2e8f0;border-radius:.875rem;padding:1.25rem 1.375rem;border-top:4px solid #e2e8f0;text-decoration:none;color:inherit;display:block;transition:box-shadow .15s,transform .15s;cursor:pointer;position:relative;overflow:hidden}
.kpi-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translateY(-1px)}
.kpi-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.875rem}
.kpi-icon-wrap{width:40px;height:40px;border-radius:.625rem;display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0}
.kpi-status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.kpi-val{font-size:2.5rem;font-weight:700;font-family:'Merriweather',serif;line-height:1;margin-bottom:.375rem}
.kpi-lbl{font-size:.8125rem;font-weight:600;color:#64748b;margin-bottom:.25rem}
.kpi-sub{font-size:.75rem;color:#94a3b8}
.kpi-action{display:flex;align-items:center;justify-content:space-between;width:100%;padding:.45rem .75rem;margin-top:.875rem;background:rgba(59,130,246,.08);color:#2563eb;border:1px solid rgba(59,130,246,.22);border-radius:.5rem;font-size:.78rem;font-weight:700;transition:all .15s;box-sizing:border-box}
.kpi-card:hover .kpi-action{background:#2563eb;color:#fff;border-color:#2563eb;box-shadow:0 2px 8px rgba(37,99,235,.25)}
.kpi-val-denom{font-size:1.25rem;font-weight:600;color:#94a3b8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.kpi-header-pill{font-size:.6875rem;font-weight:800;padding:.2rem .5rem;border-radius:1rem;letter-spacing:.02em;text-transform:uppercase}
.kpi-pill-warning{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.kpi-pill-danger{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
.kpi-pill-success{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
.kpi-pill-info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}

.kpi-border-red{border-top-color:#ef4444}
.kpi-border-orange{border-top-color:#f59e0b}
.kpi-border-green{border-top-color:#22c55e}
.kpi-border-blue{border-top-color:#3b82f6}
.kpi-border-gray{border-top-color:#94a3b8}

.dot-red{background:#ef4444}
.dot-orange{background:#f59e0b}
.dot-green{background:#22c55e}
.dot-gray{background:#94a3b8}

/* ── Sección 4 — Alertas ─────────────────────────────────────────────────── */
.section-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.875rem}
.section-title{font-size:.9375rem;font-weight:700;color:#0f172a}
.section-link{font-size:.8rem;font-weight:600;color:#3b82f6;text-decoration:none}
.section-link:hover{text-decoration:underline}

.alertas-list{background:#fff;border:1px solid #e2e8f0;border-radius:.875rem;overflow:hidden;margin-bottom:1.25rem}
.alerta-item{display:flex;align-items:center;gap:.625rem;padding:.75rem 1rem;border-bottom:1px solid #f8fafc;text-decoration:none;color:inherit;transition:background .1s;min-width:0;overflow:hidden}
.alerta-item:last-child{border-bottom:none}
.alerta-item:hover{background:#fafafa}
.alerta-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.alerta-dot-rojo{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.15)}
.alerta-dot-amarillo{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.15)}
.alerta-dot-naranja{background:#ea580c;box-shadow:0 0 0 3px rgba(234,88,12,.15)}
.alerta-dot-verde{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.alerta-icon{font-size:.9375rem;flex-shrink:0}
.alerta-texto{flex:1;font-size:.8125rem;color:#334155;font-weight:500;line-height:1.4;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alerta-ts{font-size:.7rem;color:#94a3b8;white-space:nowrap;flex-shrink:0}
.alerta-btn{flex-shrink:0;padding:.3rem .625rem;font-size:.72rem;font-weight:600;border-radius:.4rem;border:none;cursor:pointer;white-space:nowrap;transition:all .15s;text-decoration:none;display:inline-block}
.alerta-estado-badge{flex-shrink:1;min-width:0;max-width:160px;display:inline-flex;align-items:center;gap:.2rem;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:.15rem .45rem;border-radius:999px;background:rgba(245,158,11,.15);color:#92400e;border:1px solid rgba(245,158,11,.3);overflow:hidden;white-space:nowrap}
.alerta-estado-badge .badge-estado{flex-shrink:0}
.alerta-estado-badge .badge-resp{flex-shrink:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.alerta-btn-rojo{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.alerta-btn-rojo:hover{background:#fee2e2}
.alerta-btn-amarillo{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.alerta-btn-amarillo:hover{background:#fef3c7}
.alerta-btn-naranja{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.alerta-btn-naranja:hover{background:#ffedd5}
/* Tono naranja = alerta Prioritaria: entre la crítica (rojo) y la de atención (amarillo). */
.alerta-prioridad-badge{flex-shrink:0;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:.15rem .45rem;border-radius:999px;background:rgba(234,88,12,.12);color:#c2410c;border:1px solid rgba(234,88,12,.35);white-space:nowrap}
.alerta-btn-verde{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.alerta-btn-verde:hover{background:#dcfce7}

.alertas-empty{padding:1.5rem;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:.875rem;margin-bottom:1.25rem}
.alertas-empty-icon{font-size:2rem;margin-bottom:.5rem}
.alertas-empty-text{font-size:.875rem;font-weight:600;color:#16a34a}
.alertas-empty-sub{font-size:.78rem;color:#94a3b8;margin-top:.25rem}

.btn-ver-todas{display:flex;justify-content:center;padding:.75rem;background:#fff;border:1px solid #e2e8f0;border-top:none;border-radius:0 0 .875rem .875rem;margin-top:-1px;margin-bottom:1.25rem}
.btn-ver-todas a{font-size:.8125rem;font-weight:600;color:#3b82f6;text-decoration:none}
.btn-ver-todas a:hover{text-decoration:underline}

/* ── Estructura de 3 Niveles en Alertas ──────────────────────────────────── */
.mb-tier-card{background:#fff;border:1px solid #e2e8f0;border-radius:.875rem;overflow:hidden;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.04)}
body:not(.light-mode) .mb-tier-card{background:#1e293b;border-color:#334155}

/* Tier 1: Crisis */
.mb-tier-crisis{border-left:4px solid #ef4444}
.mb-tier-header{display:flex;align-items:center;justify-content:space-between;padding:.875rem 1.25rem;border-bottom:1px solid #f1f5f9;gap:.75rem}
body:not(.light-mode) .mb-tier-header{border-bottom-color:#334155}
.mb-tier-header-crisis{background:#fef2f2}
body:not(.light-mode) .mb-tier-header-crisis{background:rgba(239,68,68,.12)}
.mb-tier-title{font-size:.875rem;font-weight:700;display:flex;align-items:center;gap:.5rem;color:#0f172a}
body:not(.light-mode) .mb-tier-title{color:#f1f5f9}
.mb-tier-title-crisis{color:#991b1b}
body:not(.light-mode) .mb-tier-title-crisis{color:#fca5a5}
.mb-tier-badge{display:inline-flex;align-items:center;padding:.2rem .6rem;border-radius:999px;font-size:.72rem;font-weight:700}
.mb-tier-badge-crisis{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5}
body:not(.light-mode) .mb-tier-badge-crisis{background:rgba(239,68,68,.25);color:#fca5a5;border-color:rgba(239,68,68,.4)}

/* Crisis en Cero (Banner Verde Reasegurador) */
.mb-crisis-cero-card{display:flex;align-items:center;gap:1rem;background:#f0fdf4;border:1px solid #bbf7d0;border-left:4px solid #22c55e;border-radius:.875rem;padding:.875rem 1.25rem;margin-bottom:1rem}
body:not(.light-mode) .mb-crisis-cero-card{background:rgba(34,197,94,.08);border-color:#166534;border-left-color:#22c55e}
.mb-crisis-cero-icon{font-size:1.4rem;line-height:1;flex-shrink:0}
.mb-crisis-cero-body{flex:1;min-width:0}
.mb-crisis-cero-tit{font-size:.875rem;font-weight:700;color:#15803d}
body:not(.light-mode) .mb-crisis-cero-tit{color:#4ade80}
.mb-crisis-cero-sub{font-size:.78rem;color:#166534;margin-top:.15rem}
body:not(.light-mode) .mb-crisis-cero-sub{color:#86efac}

/* Tier 2: Radar Preventivo */
.mb-tier-preventivo{border-left:4px solid #f59e0b}
.mb-tier-header-preventivo{background:#fffbeb}
body:not(.light-mode) .mb-tier-header-preventivo{background:rgba(245,158,11,.1)}
.mb-tier-title-preventivo{color:#92400e}
body:not(.light-mode) .mb-tier-title-preventivo{color:#fcd34d}
.mb-tier-badge-preventivo{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
body:not(.light-mode) .mb-tier-badge-preventivo{background:rgba(245,158,11,.2);color:#fde68a;border-color:rgba(245,158,11,.35)}

/* Tier 3: Seguimiento de Turno (Colapsable y compacto) */
.mb-tier-rutina{border-left:4px solid #94a3b8}
.mb-rutina-btn-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:.8rem 1.25rem;background:#f8fafc;border:none;cursor:pointer;font-family:inherit;text-align:left;transition:background .15s}
body:not(.light-mode) .mb-rutina-btn-toggle{background:#1e293b}
.mb-rutina-btn-toggle:hover{background:#f1f5f9}
body:not(.light-mode) .mb-rutina-btn-toggle:hover{background:#334155}
.mb-rutina-title{font-size:.8125rem;font-weight:600;color:#475569;display:flex;align-items:center;gap:.5rem}
body:not(.light-mode) .mb-rutina-title{color:#94a3b8}
.mb-rutina-arrow{font-size:.75rem;font-weight:700;color:#64748b}
body:not(.light-mode) .mb-rutina-arrow{color:#94a3b8}

/* ── Sección 5 — Tendencia ───────────────────────────────────────────────── */
.chart-card{background:#fff;border:1px solid #e2e8f0;border-radius:.875rem;padding:1.25rem;margin-bottom:1.5rem}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.chart-title{font-size:.875rem;font-weight:700;color:#0f172a}
.chart-legend{display:flex;gap:1rem;align-items:center}
.legend-item{display:flex;align-items:center;gap:.375rem;font-size:.75rem;color:#64748b;font-weight:500}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.chart-box{height:200px;position:relative}
.chart-foot{font-size:.72rem;color:#64748b;margin-top:.5rem;line-height:1.4}

/* ── Modal Semáforo ──────────────────────────────────────────────────────── */
.sg-modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem}
.sg-modal{background:#fff;border-radius:1rem;padding:1.75rem;max-width:480px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.sg-modal-wide{max-width:620px}
.sg-detail-section{margin-top:1.25rem}
.sg-detail-section:first-of-type{margin-top:0}
.sg-detail-heading{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin-bottom:.4rem;display:flex;align-items:center;gap:.4rem}
.sg-detail-list{border:1px solid #f1f5f9;border-radius:.6rem;overflow:hidden}
.sg-detail-empty{font-size:.78rem;color:#64748b;padding:.5rem 0}
.sg-detail-loading{font-size:.78rem;color:#94a3b8;padding:.5rem 0}
.sg-asignados{border:1px solid #fcd34d;background:rgba(251,191,36,.07);border-radius:.75rem;padding:.875rem;margin-bottom:1.25rem}
.sg-asignados .sg-detail-heading{color:#b45309;margin-bottom:.55rem}
.sg-asignados .sg-detail-list{border-color:#fde68a;background:#fff}
.sg-asig-row{display:flex;align-items:stretch;gap:0;border-bottom:1px solid #f1f5f9}
.sg-asig-row:last-child{border-bottom:none}
.sg-asig-row > .alerta-item{flex:1;min-width:0}
.btn-gestionar{flex-shrink:0;border:none;border-left:1px solid #f1f5f9;background:transparent;color:#15803d;font-family:inherit;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:0 .7rem;cursor:pointer;white-space:nowrap}
.btn-gestionar:hover{background:rgba(22,163,74,.1)}
.btn-gestionar:disabled{opacity:.5;cursor:default}
body:not(.light-mode) .sg-asignados{border-color:#78350f;background:rgba(120,53,15,.25)}
body:not(.light-mode) .sg-asignados .sg-detail-heading{color:#fcd34d}
body:not(.light-mode) .sg-asignados .sg-detail-list{border-color:#78350f;background:#1e293b}
body:not(.light-mode) .sg-asig-row{border-bottom-color:#334155}
body:not(.light-mode) .btn-gestionar{border-left-color:#334155;color:#4ade80}
body:not(.light-mode) .sg-detail-list{border-color:#334155}
body:not(.light-mode) .sg-detail-heading{color:#94a3b8}

/* ── Clientes en riesgo ──────────────────────────────────────────────────── */
.clientes-riesgo-wrap{margin-bottom:1.25rem}
.cr-card{display:flex;align-items:center;gap:.625rem;flex-wrap:wrap;width:100%;text-align:left;font:inherit;background:#fff;border:1px solid #fecaca;border-left:4px solid #ef4444;border-radius:.875rem;padding:.875rem 1.25rem;box-shadow:0 2px 8px rgba(239,68,68,0.06);cursor:pointer;transition:all .15s ease}
.cr-card:hover{background:#fef2f2;box-shadow:0 4px 14px rgba(239,68,68,.12)}
.cr-title-box{display:flex;align-items:center;gap:.5rem;font-size:.9375rem;font-weight:700;color:#991b1b;flex-shrink:0}
.cr-icon{font-size:1.1rem;line-height:1}
/* Resumen de una línea: los tres de menor calificación. */
.cr-resumen{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;min-width:0;font-size:.8125rem;color:#334155}
.cr-chip{display:inline-flex;align-items:center;gap:.3rem;min-width:0}
.cr-chip-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:14rem}
.cr-chip-score{font-weight:700;font-variant-numeric:tabular-nums}
.cr-sep{color:#cbd5e1;font-weight:700}
/* Sin clientes en riesgo el renglón se queda, en verde y sin clic: que el
   indicador se haya evaluado y salido bien también es información. */
.cr-card-ok{border-color:#bbf7d0;border-left-color:#22c55e;box-shadow:0 2px 8px rgba(34,197,94,.06);cursor:default}
.cr-card-ok:hover{background:#fff;box-shadow:0 2px 8px rgba(34,197,94,.06)}
.cr-card-ok .cr-title-box{color:#166534}
/* Sin un solo cliente calificable no hay nada que semaforizar: gris. El verde
   afirma que se evaluó y salió bien, y eso es justo lo que no se sabe. */
.cr-card-neutro{border-color:#e2e8f0;border-left-color:#94a3b8;box-shadow:0 2px 8px rgba(100,116,139,.06)}
.cr-card-neutro:hover{background:#f8fafc;box-shadow:0 4px 14px rgba(100,116,139,.12)}
.cr-card-neutro .cr-title-box{color:#334155}
.cr-vacio{color:#475569}
.cr-sin-nota{color:#64748b}
.cr-all-link{font-size:.78rem;font-weight:600;color:#2563eb;text-decoration:none;display:inline-flex;align-items:center;gap:.25rem;margin-left:auto;flex-shrink:0;transition:color .15s}
.cr-card:hover .cr-all-link,.cr-all-link:hover{color:#1d4ed8;text-decoration:underline}
.cr-items{display:flex;flex-direction:column;gap:.35rem}
.cr-item{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.4rem .625rem;border-radius:.5rem;font-size:.8125rem;color:#334155;text-decoration:none;background:#fef2f2;transition:background .15s,transform .1s}
.cr-item:hover{background:#fee2e2;transform:translateX(2px)}
.cr-item-left{display:flex;align-items:center;gap:.4rem;min-width:0;overflow:hidden}
.cr-bullet{color:#ef4444;font-weight:700;font-size:.9rem;line-height:1}
.cr-item-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-item-score-wrap{display:inline-flex;align-items:center;gap:.375rem;flex-shrink:0}
.cr-item-score{font-weight:700;font-variant-numeric:tabular-nums;font-size:.875rem}
.cr-score-rojo{color:#dc2626}
.cr-score-amarillo{color:#d97706}
.cr-item-badge{font-size:.68rem;font-weight:600;padding:.1rem .45rem;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.cr-badge-rojo{background:rgba(239,68,68,0.12);color:#b91c1c;border:1px solid rgba(239,68,68,0.25)}
.cr-badge-amarillo{background:rgba(245,158,11,0.12);color:#b45309;border:1px solid rgba(245,158,11,0.25)}
/* Listado de clientes sin calificar: mismo renglón que el de riesgo, en gris. */
.cr-item-sin{background:#f8fafc}
.cr-item-sin:hover{background:#f1f5f9}
.cr-item-sin .cr-bullet{color:#94a3b8}
.cr-ejes{font-weight:700;font-variant-numeric:tabular-nums;font-size:.8125rem;color:#475569}
.cr-ejes-cero{color:#94a3b8}

/* ── Responsive ──────────────────────────────────────────────────────────── */

@media(max-width:900px){.main{margin-left:200px}.sidebar{width:200px}}
@media(max-width:700px){
  .sidebar{transform:translateX(-100%);width:240px}
  .sidebar.mobile-open{transform:translateX(0)}
  .main{margin-left:0}
  .topbar{padding:.75rem 1rem;gap:.375rem}
  .page-title{font-size:.875rem}
  .page-subtitle{display:none}
  .content{padding:.875rem 1rem}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .greeting-title{font-size:1.2rem}
  .btn-ver-operacion span{display:none}
  .btn-ver-operacion{padding:0 .625rem}
  .auto-refresh-badge{display:none}
  .semaforo-global{padding:1rem 1.125rem;gap:1rem}
  .sg-estado{font-size:1rem}
  .kpi-card{padding:1rem 1.125rem}
  .kpi-val{font-size:2.25rem}
  .alerta-ts{display:none}
  /* El resumen baja a su propia línea bajo el título, en vez de partirse
     entre el título y el enlace. */
  .cr-card{gap:.375rem .625rem;padding:.75rem .875rem}
  .cr-title-box{font-size:.875rem}
  .cr-resumen{order:3;width:100%;font-size:.78rem;gap:.375rem}
  .cr-chip-name{max-width:9rem}
  /* Detalle del semáforo (la ventana "Detalle de novedades") en celular. Cada
     fila es un flex de una sola línea donde todo tiene ancho fijo menos el texto
     del hallazgo: en pantalla angosta el texto queda con cero de ancho y, como
     puede partir líneas, se rompe letra por letra — la "línea punteada" vertical
     que se veía en el teléfono, con filas altísimas y sin nada legible.
     La fila pasa a apilar: el texto arriba a todo el ancho (la base de
     100% − 3.5rem deja sitio sólo para el punto y el ícono, así ningún otro
     elemento cabe a su lado sin importar el ancho), debajo el estado, la
     antigüedad y la acción, y "Gestionar" como barra propia al pie. */
  .sg-modal{padding:1.125rem 1rem}
  .sg-asignados{padding:.625rem}
  .sg-modal .sg-detail-heading{flex-wrap:wrap;row-gap:.1rem}
  .sg-modal .alerta-item{flex-wrap:wrap;row-gap:.45rem;padding:.7rem .75rem}
  .sg-modal .alerta-texto{flex:1 1 calc(100% - 3.5rem);white-space:normal}
  .sg-modal .alerta-estado-badge{max-width:100%}
  .sg-modal .alerta-ts{display:inline;margin-left:auto}
  .sg-asig-row{flex-wrap:wrap}
  .sg-asig-row > .alerta-item{flex:1 1 100%}
  .btn-gestionar{flex:1 1 100%;border-left:none;border-top:1px solid #f1f5f9;padding:.55rem .7rem}
  body:not(.light-mode) .btn-gestionar{border-top-color:#334155}
}
@media(max-width:420px){
  .content{padding:.75rem}
  .kpi-val{font-size:1.875rem}
  .kpi-grid{gap:.625rem}
  .kpi-card{padding:.875rem 1rem}
  .greeting-title{font-size:1.1rem}
  .alerta-btn{display:none}
  .alerta-texto{white-space:normal}
  .chart-card{padding:1rem}
  .alerta-estado-badge{max-width:80px}
  .alerta-estado-badge .badge-resp{display:none}
  /* Dentro de la ventana de detalle la fila ya está apilada y sí cabe la acción
     y el responsable, que aquí arriba se ocultan para la lista principal. La
     antigüedad no: con estado y acción en la misma línea ya no entra a 375px. */
  .sg-modal-overlay{padding:.5rem}
  .sg-modal .alerta-btn{display:inline-block;margin-left:auto}
  .sg-modal .alerta-ts{display:none}
  .sg-modal .alerta-estado-badge{max-width:55%}
  .sg-modal .alerta-estado-badge .badge-resp{display:block}
}
.hidden{display:none!important}

<script>
// ── Utilidades ────────────────────────────────────────────────────────────────

const DIAS_ES = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function _saludo() {
    const h = new Date().getHours();
    if (h < 12) return 'Buenos días';
    if (h < 19) return 'Buenas tardes';
    return 'Buenas noches';
}

function _fechaLarga() {
    const d = new Date();
    return `${DIAS_ES[d.getDay()]}, ${d.getDate()} de ${MESES_ES[d.getMonth()]} de ${d.getFullYear()}`;
}

function _relTime(isoStr) {
    if (!isoStr) return '';
    const diff = Date.now() - new Date(isoStr).getTime();
    const h = Math.floor(diff / 3600000);
    if (h < 1)  return 'hace minutos';
    if (h < 24) return `hace ${h}h`;
    return `hace ${Math.floor(h / 24)}d`;
}

function _isDark() { return !document.body.classList.contains('light-mode'); }

// ── Estado global ─────────────────────────────────────────────────────────────

let _kpis           = null;
let _alertasData    = [];
let _tendencia      = [];
let _thresholds     = {};
let _chart          = null;
let _refreshTimer   = null;
let _alertasExpanded = false;   // controls "ver todas" toggle

// ── Saludo + fecha ────────────────────────────────────────────────────────────

(function initGreeting() {
    const nombre = {{ (user_name or current_user) | tojson }};
    document.getElementById('greetingTitle').textContent = `${_saludo()}, ${nombre}.`;
    const fechaStr = _fechaLarga();
    document.getElementById('greetingDate').textContent = `Hoy es ${fechaStr}.`;

    // Topbar fecha corta
    const d = new Date();
    document.getElementById('topbarFecha').textContent =
        `${d.getDate()} ${MESES_ES[d.getMonth()].slice(0,3)}`;
})();

// ── KPI helpers ───────────────────────────────────────────────────────────────

function _kpiIncColor(val) {
    if (val === 0) return { border: '#22c55e', dot: 'dot-green' };
    if (val <= 2)  return { border: '#f59e0b', dot: 'dot-orange' };
    return { border: '#ef4444', dot: 'dot-red' };
}

// Misma función de cálculo que la tabla y el PDF del Dashboard de Supervisión
// (Fases 1 y 2, 2026-10-09): últimos 7 días cerrados para todos los clientes, cada
// formulario cuenta como una visita, meta repartida por día y tope por cliente
// (por día en los diarios).
// Línea 1: programadas, período y porcentaje. Línea 2: ayer y hoy (En curso).
const SUP_AYUDA = 'Últimos 7 días cerrados, sin hoy. Cada formulario cuenta como una visita. '
    + 'Cada cliente cuenta hasta lo que tiene programado (tope): el exceso de uno no compensa el '
    + 'faltante de otro, y en los clientes diarios el exceso de un día no compensa el faltante de otro. '
    + 'Hoy se muestra aparte como En curso.';
function _kpiSupSub(k) {
    const prog = k.sup_programadas ?? 0;
    const comp = k.sup_completadas ?? 0;
    const pend = k.sup_pendientes ?? Math.max(0, prog - comp);
    const clientesPend = (k.sup_por_cliente || []).filter(c => (c.pendientes || 0) > 0).length;
    const enCurso = k.sup_en_curso ?? 0;
    const ayer = k.sup_ayer ?? 0;
    const linea2 = `Ayer: ${ayer} realizadas · Hoy: ${enCurso} en curso`;
    if (prog > 0) {
        if (pend > 0) {
            const clisTxt = clientesPend > 0 ? ` en ${clientesPend} cliente${clientesPend !== 1 ? 's' : ''}` : '';
            return `<strong>${pend} pendiente${pend !== 1 ? 's' : ''}</strong>${clisTxt} (${Math.round(k.sup_pct ?? (comp/prog*100))}% de meta semanal alcanzada)<br>${linea2}`;
        }
        return `Meta semanal 100% alcanzada (${comp} de ${prog})<br>${linea2}`;
    }
    if (k.sup_sin_dia_cerrado) return `Sin días cerrados en la ventana<br>${linea2}`;
    return `0 programadas<br>${linea2}`;
}
function _fmtCuota(c) {
    const n = Number(c);
    if (isNaN(n)) return '';
    return n % 1 === 0 ? String(n) : n.toFixed(1);
}
// Nota al pie del gráfico: la suma de la ventana con los números de la tarjeta.
function _notaTendencia(k) {
    const prog = k.sup_programadas ?? 0, real = k.sup_realizadas ?? 0, comp = k.sup_completadas ?? 0;
    const dias = k.sup_dias ?? 7, cuota = Number(k.sup_programadas_dia);
    if (!(prog > 0)) return k.sup_sin_dia_cerrado ? 'Sin días cerrados en la ventana.' : 'Sin supervisiones programadas en estos días.';
    const exacta = !isNaN(cuota) && cuota > 0 && Math.round(cuota * dias) === prog;
    const suma = exacta ? `${_fmtCuota(cuota)} × ${dias} = ${prog} programadas` : `≈ ${_fmtCuota(cuota)} por día · ${prog} programadas`;
    return `La tarjeta suma estos ${dias} días: ${suma}. Se realizaron ${real}; cuentan ${comp} porque cada cliente cuenta hasta lo prometido.`;
}

function _kpiSupColor(comp, prog, thr, pctDado) {
    if (prog === 0 || pctDado === null) return { border: '#94a3b8', dot: 'dot-gray' };
    const pct = (pctDado !== undefined && pctDado !== null) ? pctDado : comp / prog * 100;
    const verdeMin    = thr?.supervision_verde_min    ?? 90;
    const amarilloMin = thr?.supervision_amarillo_min ?? 70;
    if (pct >= verdeMin)    return { border: '#22c55e', dot: 'dot-green' };
    if (pct >= amarilloMin) return { border: '#f59e0b', dot: 'dot-orange' };
    return { border: '#ef4444', dot: 'dot-red' };
}

function _kpiEqColor(noOp, total, thr) {
    if (total === 0) return { border: '#94a3b8', dot: 'dot-gray' };
    const pct = noOp / total * 100;
    const verdeMax    = thr?.eq_verde_max    ?? 5;
    const amarilloMax = thr?.eq_amarillo_max ?? 15;
    if (pct <= verdeMax)    return { border: '#22c55e', dot: 'dot-green' };
    if (pct <= amarilloMax) return { border: '#f59e0b', dot: 'dot-orange' };
    return { border: '#ef4444', dot: 'dot-red' };
}

function _kpiCertColor(proximas) {
    if (proximas === 0) return { border: '#22c55e', dot: 'dot-green' };
    if (proximas <= 3)  return { border: '#f59e0b', dot: 'dot-orange' };
    return { border: '#ef4444', dot: 'dot-red' };
}

function _kpiCompColor(vencidos, porVencer) {
    if (vencidos > 0)   return { border: '#ef4444', dot: 'dot-red' };
    if (porVencer > 0)  return { border: '#f59e0b', dot: 'dot-orange' };
    return { border: '#22c55e', dot: 'dot-green' };
}

function _kpiVisitaColor(comp, prog, thr, visitaPct, visitaEsperadas) {
    if (prog === 0) return { border: '#94a3b8', dot: 'dot-gray' };
    const esperadas = visitaEsperadas ?? prog;
    if ((visitaPct === null || visitaPct === undefined) && esperadas === 0) {
        return { border: '#22c55e', dot: 'dot-green' };
    }
    const pct = (visitaPct !== null && visitaPct !== undefined)
        ? visitaPct
        : (esperadas > 0 ? (comp / esperadas * 100) : 100);
    const verdeMin    = thr?.visita_verde_min    ?? 90;
    const amarilloMin = thr?.visita_amarillo_min ?? 70;
    if (pct >= verdeMin)    return { border: '#22c55e', dot: 'dot-green' };
    if (pct >= amarilloMin) return { border: '#f59e0b', dot: 'dot-orange' };
    return { border: '#ef4444', dot: 'dot-red' };
}

function _kpiVisitaSub(k) {
    const comp = k.visita_completadas ?? 0;
    const prog = k.visita_programadas ?? 0;
    if (prog <= 0) return '0 programadas';
    const esperadas = k.visita_esperadas_hoy;
    if (esperadas !== undefined && esperadas !== null) {
        if (esperadas === 0 && comp < prog) {
            return `de ${prog} programadas · en curso`;
        }
        if (esperadas > 0 && esperadas < prog) {
            return `de ${prog} programadas (${esperadas} esperadas a ayer)`;
        }
    }
    return `de ${prog} programadas (${Math.round(comp / prog * 100)}%)`;
}

// ── Render KPI cards ──────────────────────────────────────────────────────────

function _eqTipo(porTipo, ...claves) {
    for (const k of claves) {
        if (porTipo?.[k]) return porTipo[k];
    }
    return null;
}

/** Fecha local en YYYY-MM-DD.
 *
 * `toISOString()` devuelve UTC: en Bogotá (UTC-5), a partir de las 19:00 daba
 * ya la fecha de mañana, así que el enlace "Ver supervisiones" navegaba a un
 * día sin registros y la pantalla de destino salía en 0 aunque el indicador
 * de origen mostrara actividad.
 */
function _fechaLocal(d) {
    return d.getFullYear() + '-' +
           String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
}

function renderKpis(k, thr) {
    const today = _fechaLocal(new Date());

    // Equipos: radios y armas (parque registrado en Bases de Datos + estado del
    // inventario de Confiabilidad de Equipos) y motos (planilla de motocicletas,
    // la misma fuente que Recursos; en el inventario nunca hubo filas de motos).
    const radioData = _eqTipo(k.eq_por_tipo, 'radio', 'radios');
    const armaData  = _eqTipo(k.eq_por_tipo, 'arma', 'armas');
    const motoTotal = k.moto_total ?? 0;
    const motoAptas = k.moto_aptas ?? 0;

    // Sin inventario de radios NO se hereda el total general de equipos: eso
    // ponía cámaras, alarmas y controles de acceso bajo la etiqueta de radios
    // —el mismo error de "número correcto, etiqueta equivocada" que ya se quitó
    // de la pantalla de Recursos—.
    const radioTotal = radioData?.total ?? 0;
    const radioOp    = radioData?.operativos ?? 0;
    const radioNoOp  = Math.max(0, radioTotal - radioOp);
    const armaTotal  = armaData?.total ?? 0;
    const armaOp     = armaData?.operativos ?? 0;

    // Registrados en supervision_puesto: lo mismo que lista Bases de Datos. Es
    // el parque real; el inventario sólo dice cuántos de ellos funcionan.
    const radioReg = k.radios_registrados ?? 0;
    const armaReg  = k.armas_registrados  ?? 0;
    // Desglose de los registrados: seriales distintos vs supervisiones donde no
    // se anotó el serial (Bases de Datos las lista una por una). Así "140 radios"
    // se lee como lo que es: pocos seriales y muchas supervisiones sin serial.
    const radioRegSerial    = k.radios_registrados_con_serial;
    const radioRegSinSerial = k.radios_registrados_sin_serial;

    // Cifra principal: unidades registradas, radios + armas. Si el parque no está
    // en Bases de Datos pero sí en el inventario, se usa el inventario. La primera
    // frase del detalle la explica para que no se lea como "cantidad de radios".
    const radiosParque = radioReg || radioTotal;
    const armasParque  = armaReg  || armaTotal;
    const equiposTotal = radiosParque + armasParque;
    const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
    const eqDetalle = [
        equiposTotal > 0
            ? `${plural(radiosParque, 'radio', 'radios')} y ${plural(armasParque, 'arma', 'armas')} registrados en Bases de Datos`
              + (radioReg > 0 && radioRegSerial != null
                  ? ` (radios: ${radioRegSerial} con serial, ${radioRegSinSerial} supervisiones sin serial)`
                  : '')
            : 'Sin radios ni armas registrados en Bases de Datos',
        radioTotal > 0
            ? `Radios operativos: ${radioOp} de ${radioTotal}`
              + (radioReg > 0 ? ` · estado capturado en Confiabilidad para ${radioTotal} de ${radioReg} registrados` : '')
            : 'Radios operativos: estado sin capturar en Confiabilidad de Equipos',
        `Armas registradas: ${armasParque}` + (armaTotal > 0 ? ` (${armaOp} de ${armaTotal} óptimas)` : ''),
        motoTotal > 0
            ? `Motos aptas: ${motoAptas} de ${motoTotal}`
            : 'Motos aptas: sin planillas registradas',
    ];

    // Certificaciones por nivel
    const certNivel = k.cert_por_nivel ?? {};
    const certSubLines = Object.keys(certNivel).length
        ? Object.entries(certNivel).map(([n, v]) => `${n}: ${v}`).join(' · ')
        : 'en los próximos 30 días';

    const progSup = k.sup_programadas ?? 0;
    const compSup = k.sup_completadas ?? 0;
    const pendSup = k.sup_pendientes ?? Math.max(0, progSup - compSup);
    const clisPendSup = (k.sup_por_cliente || []).filter(c => (c.pendientes || 0) > 0).length;

    const kpiDefs = [
        {
            id: 'kpiInc',
            icon: '⚠️', iconBg: '#fef2f2',
            val: k.inc_abiertos ?? 0,
            lbl: 'Incidentes Abiertos',
            pill: (k.inc_abiertos > 0)
                ? { cls: ((k.inc_criticos ?? 0) > 0 ? 'kpi-pill-danger' : 'kpi-pill-warning'), text: `${k.inc_abiertos} ABIERTO${k.inc_abiertos !== 1 ? 'S' : ''}` }
                : { cls: 'kpi-pill-success', text: 'AL DÍA' },
            sub: (k.inc_mas_24h ?? 0) > 0
                ? `${k.inc_mas_24h} llevan más de 24h sin gestión`
                : 'Todos gestionados en las últimas 24h',
            action: '<span>👉 Gestionar incidentes</span><span>→</span>',
            color: _kpiIncColor(k.inc_abiertos ?? 0),
        },
        {
            id: 'kpiSup',
            icon: '👁️', iconBg: '#eff6ff',
            val: (progSup > 0)
                ? `${compSup} <span class="kpi-val-denom">/ ${progSup}</span>`
                : (k.sup_en_curso ?? 0),
            lbl: 'Supervisiones',
            pill: (pendSup > 0)
                ? { cls: 'kpi-pill-warning', text: `⚠️ ${pendSup} PENDIENTES` }
                : (progSup > 0 ? { cls: 'kpi-pill-success', text: '100% AL DÍA' } : null),
            sub: _kpiSupSub(k),
            help: SUP_AYUDA,
            action: (pendSup > 0)
                ? `<span>👉 Ver ${clisPendSup > 0 ? `${clisPendSup} clientes con pendientes` : `${pendSup} pendientes`}</span><span>→</span>`
                : '<span>👉 Ver cobertura de clientes</span><span>→</span>',
            color: _kpiSupColor(k.sup_completadas ?? 0, k.sup_programadas ?? 0, thr, k.sup_pct ?? null),
        },
        {
            id: 'kpiEq',
            icon: '🧰', iconBg: '#fff7ed',
            val: (k.eq_no_op > 0)
                ? `${k.eq_no_op} con falla`
                : (radioTotal > 0 || armaTotal > 0 ? '100% operativos' : (equiposTotal > 0 ? equiposTotal : '—')),
            lbl: 'Confiabilidad de Equipos',
            pill: (k.eq_no_op > 0)
                ? { cls: 'kpi-pill-danger', text: `${k.eq_no_op} INOPERATIVO${k.eq_no_op !== 1 ? 'S' : ''}` }
                : { cls: 'kpi-pill-success', text: '100% OPERATIVO' },
            sub: (k.eq_no_op > 0)
                ? `${k.eq_no_op} equipo${k.eq_no_op !== 1 ? 's' : ''} inoperativo${k.eq_no_op !== 1 ? 's' : ''} en puestos · ${k.eq_pct ?? 0}% operatividad`
                : (radioTotal > 0 || armaTotal > 0
                    ? `Todos los equipos operando en puestos (${radioOp} radios · ${armaOp} armas)`
                    : eqDetalle.join(' · ')),
            action: (k.eq_no_op > 0)
                ? '<span>👉 Resolver fallas de equipos</span><span>→</span>'
                : '<span>👉 Ver estado de equipos</span><span>→</span>',
            color: _kpiEqColor(radioNoOp, radioTotal, thr),
        },
        {
            id: 'kpiCert',
            icon: '📋', iconBg: '#f0fdf4',
            val: k.cert_proximas ?? 0,
            lbl: 'Cumplimiento Normativo',
            pill: (k.cert_proximas > 0)

                : { cls: 'kpi-pill-success', text: 'AL DÍA' },
            sub: certSubLines,
            action: '<span>👉 Revisar vencimientos</span><span>→</span>',
            color: _kpiCertColor(k.cert_proximas ?? 0),
        },
        {
            id: 'kpiComp',
            icon: '🤝', iconBg: '#f5f3ff',
            val: k.comp_vencidos ?? 0,
            lbl: 'Compromisos de Visitas',
            pill: (k.comp_vencidos > 0)
                ? { cls: 'kpi-pill-danger', text: `${k.comp_vencidos} VENCIDO${k.comp_vencidos !== 1 ? 'S' : ''}` }
                : ((k.comp_por_vencer > 0) ? { cls: 'kpi-pill-warning', text: `${k.comp_por_vencer} POR VENCER` } : null),
            sub: (k.comp_vencidos ?? 0) > 0
                ? `${k.comp_vencidos} vencido${k.comp_vencidos !== 1 ? 's' : ''} · ${k.comp_por_vencer ?? 0} por vencer`
                : (k.comp_por_vencer ?? 0) > 0
                    ? `${k.comp_por_vencer} por vencer próximamente`
                    : 'Sin compromisos vencidos',
            action: '<span>👉 Gestionar compromisos</span><span>→</span>',
            color: _kpiCompColor(k.comp_vencidos ?? 0, k.comp_por_vencer ?? 0),
        },
        {
            id: 'kpiVisita',
            icon: '🚗', iconBg: '#eff6ff',
            val: k.visita_completadas ?? 0,
            lbl: 'Visitas a Clientes',
            sub: _kpiVisitaSub(k),
            action: '<span>👉 Ver agenda y avance</span><span>→</span>',
            color: _kpiVisitaColor(
                k.visita_completadas ?? 0,
                k.visita_programadas ?? 0,
                thr,
                k.visita_pct,
                k.visita_esperadas_hoy
            ),
        },
    ];

    const grid = document.getElementById('kpiGrid');
    grid.innerHTML = kpiDefs.map(d => `
        <div class="kpi-card" onclick="abrirModalKpi('${d.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();abrirModalKpi('${d.id}')}" style="border-top-color:${d.color.border};cursor:pointer"${d.help ? ` title="${d.help}"` : ''}>
            <div class="kpi-card-header">
                <div class="kpi-icon-wrap" style="background:${d.iconBg}">${d.icon}</div>
                <div style="display:flex;align-items:center;gap:.5rem">
                    ${d.pill ? `<span class="kpi-header-pill ${d.pill.cls}">${d.pill.text}</span>` : ''}
                    <div class="kpi-status-dot ${d.color.dot}"></div>
                </div>
            </div>
            <div class="kpi-val">${d.val}</div>
            <div class="kpi-lbl">${d.lbl}</div>
            <div class="kpi-sub">${d.sub}</div>
            <div class="kpi-action">${d.action}</div>
        </div>
    `).join('');

    document.getElementById('supChipText').textContent = (k.sup_programadas ?? 0) > 0
        ? `${k.sup_programadas} supervisiones programadas · ${k.sup_periodo_label || 'últimos 7 días'} · ${k.sup_en_curso ?? 0} en curso hoy`
        : (k.sup_sin_dia_cerrado ? `Sin días cerrados en la ventana · ${k.sup_en_curso ?? 0} en curso hoy`
                                 : '0 supervisiones programadas');
}

// ── Modales Contextuales para Llamado a la Acción Directa de KPIs ─────────────

function _abrirDetalleKpiItem(formType, recordId, motivo, titulo) {
    document.querySelectorAll('.sg-modal-overlay').forEach(m => m.remove());
    _getAlertViewer(formType).openRecord(recordId, {
        motivo: motivo || '',
        hallazgoRef: `kpi_${formType}_${recordId}`,
        hallazgoTitulo: titulo || ''
    });
}

function agendarRondaSupervision(clienteNombre, pendientes) {
    document.querySelectorAll('.sg-modal-overlay').forEach(m => m.remove());
    if (window.AgendarVisita) {
        window.AgendarVisita.abrir({
            clienteNombre: clienteNombre || '',
            motivo: 'Auditoría de seguridad',
            contexto: `Ronda de supervisión requerida para ${clienteNombre || 'instalación'}: cuenta con ${pendientes} visita${pendientes !== 1 ? 's' : ''} pendiente${pendientes !== 1 ? 's' : ''} para cumplir la cuota del período.`,
        });
    } else {
        alert('El módulo de agendamiento no está disponible en este momento.');
    }
}

function agendarVisitaGerencial(clienteNombre, motivo, contexto) {
    document.querySelectorAll('.sg-modal-overlay').forEach(m => m.remove());
    if (window.AgendarVisita) {
        window.AgendarVisita.abrir({
            clienteNombre: clienteNombre || '',
            motivo: motivo || 'Seguimiento de servicio',
            contexto: contexto || `Visita gerencial de fidelización y seguimiento. Cuota del período: ${_kpis?.visita_completadas ?? 0} de ${_kpis?.visita_programadas ?? 0} completadas.`,
        });
    } else {
        alert('El módulo de agendamiento no está disponible en este momento.');
    }
}

function abrirModalKpi(id) {
    if (!_kpis) return;
    if (id === 'kpiInc') abrirModalKpiIncidentes();
    else if (id === 'kpiSup') abrirModalKpiSupervisiones();
    else if (id === 'kpiEq') abrirModalKpiEquipos();
    else if (id === 'kpiCert') abrirModalKpiCertificaciones();
    else if (id === 'kpiComp') abrirModalKpiCompromisos();
    else if (id === 'kpiVisita') abrirModalKpiVisitas();
}

function _crearModalKpi(titulo, subtitulo, contenidoHtml, linkModuloHref, linkModuloTexto) {
    const modal = document.createElement('div');
    modal.className = 'sg-modal-overlay';
    modal.innerHTML = `
        <div class="sg-modal sg-modal-wide">
            <div class="sg-modal-title">${titulo}</div>
            <div class="sg-modal-sub">${subtitulo}</div>
            <div class="kpi-modal-body" style="max-height:60vh;overflow-y:auto;margin-bottom:1rem">
                ${contenidoHtml}
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-top:.75rem;border-top:1px solid rgba(148,163,184,.2)">
                <a href="${linkModuloHref}" target="_blank" class="cr-all-link" style="margin:0">${linkModuloTexto}</a>
                <button onclick="this.closest('.sg-modal-overlay').remove()"
                    style="padding:.5rem 1.1rem;background:#0f172a;color:#fff;border:none;border-radius:.5rem;font-weight:600;cursor:pointer;font-size:.85rem">
                    Cerrar
                </button>
            </div>
        </div>`;
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
}

// ── Render Clientes en riesgo ─────────────────────────────────────────────────

// La lista completa no se pinta en el briefing: se guarda aquí y se abre en una
// ventana al tocar el renglón. Así el bloque ocupa una línea sin importar si hay
// 3 clientes en riesgo o 30.
let _crClientes = [];
// Los que no llegaron a calificarse, con su cobertura de ejes. El backend los
// manda de mayor a menor: primero los que están más cerca de poder evaluarse.
let _crSinCalificar = [];

function _crNota(c) {
    return typeof c.nota === 'number' ? Math.round(c.nota) : (c.nota || '—');
}

function _crItemHtml(c) {
    const scoreCls = c.color === 'rojo' ? 'cr-score-rojo' : 'cr-score-amarillo';
    const badgeCls = c.color === 'rojo' ? 'cr-badge-rojo' : 'cr-badge-amarillo';
    return `
        <div class="cr-item" style="cursor:default">
            <div class="cr-item-left">
                <span class="cr-bullet">•</span>
                <span class="cr-item-name">${_esc(c.nombre)}</span>
                <span style="color:#94a3b8;font-weight:400">—</span>
                <span class="cr-item-score ${scoreCls}">${_crNota(c)}</span>
                <span class="cr-item-badge ${badgeCls}">${_esc(c.banda)}</span>
            </div>
            <div style="display:flex;align-items:center;gap:.4rem;flex-shrink:0">
                <button type="button" class="kpi-modal-btn" style="background:#2563eb;color:#fff;padding:.3rem .6rem;font-size:.75rem" onclick="agendarVisitaGerencial('${_esc(c.nombre)}', 'Atención de quejas o reclamos', 'Visita urgente de retención: cliente en banda ${_esc(c.banda)} (Nota: ${_crNota(c)}/100).')">
                    📅 Agendar Visita ↗
                </button>
                <a href="/dashboard/gestion/?cliente=${encodeURIComponent(c.id != null ? c.id : c.nombre)}"
                   target="_blank" style="font-size:.72rem;color:#64748b;text-decoration:none;padding:.2rem .35rem" title="Ver ficha analítica en Gestión">
                    Ficha ↗
                </a>
            </div>
        </div>
    `;
}

function _crSinItemHtml(c) {
    const ejes = c.ejes_con_datos ?? 0;
    const esPrelim = c.estado_cobertura === 'preliminar' || (ejes === 2 && c.nota != null);
    // Se califica con 3 de 4 ejes; con 2 ejes es Preliminar y en cero no hay ni por dónde empezar.
    const ejesCls = ejes === 0 ? 'cr-ejes cr-ejes-cero' : 'cr-ejes';
    const etiqueta = esPrelim && c.nota != null
        ? `Preliminar (${Math.round(c.nota)}) · ${ejes} de 4 ejes`
        : `${ejes} de 4 ejes`;
    return `
        <div class="cr-item cr-item-sin" style="cursor:default">
            <div class="cr-item-left">
                <span class="cr-bullet">•</span>

                    📅 Agendar Visita ↗

function renderClientesEnRiesgo(data) {
    const wrap = document.getElementById('clientesRiesgoWrap');
    if (!wrap) return;
    const total = data?.total || 0;
    _crClientes = data?.clientes || [];
    _crSinCalificar = data?.clientes_sin_calificar || [];
    // El backend ya manda los tres peores; si no vinieran, los primeros de la
    // lista lo son igual: `_estatus_ranking` ordena de menor a mayor nota.
    const top = (data?.top?.length ? data.top : _crClientes).slice(0, 3);

    // Cobertura de la evaluación. Un cliente sin información suficiente no está
    // en riesgo: está sin calificar, y no puede sumar a ninguno de los dos lados.
    const calificados = data?.calificados ?? 0;
    const totalClientes = data?.total_clientes ?? (calificados + _crSinCalificar.length);
    const evaluado = data?.evaluado !== false;

    const card = document.getElementById('crCard');
    const icono = document.getElementById('crIcon');
    const titulo = document.getElementById('crTitle');
    const resumen = document.getElementById('crResumen');
    const verTodos = document.getElementById('crVerTodos');
    card.classList.remove('cr-card-ok', 'cr-card-neutro');

    // ESTADO 1 — Nadie calificado: gris. El verde afirmaría que se evaluó a los
    // clientes y ninguno está mal; aquí lo único cierto es que no se sabe.
    if (!evaluado || calificados === 0) {
        card.classList.add('cr-card-neutro');
        icono.textContent = '⚪';
        if (!evaluado) {
            titulo.innerHTML = 'Estatus de cliente: no evaluado';
            resumen.innerHTML = '<span class="cr-sin-nota">No se pudo calcular en el período</span>';
        } else if (totalClientes === 0) {
            titulo.innerHTML = 'Estatus de cliente: sin clientes registrados';
            resumen.innerHTML = '<span class="cr-sin-nota">No hay clientes que evaluar en el período</span>';
        } else {
            titulo.innerHTML = `Estatus de cliente: <strong>0</strong> de ${totalClientes} cliente`
                             + `${totalClientes !== 1 ? 's' : ''} calificado${totalClientes !== 1 ? 's' : ''}`;
            resumen.innerHTML = '<span class="cr-sin-nota">Información insuficiente en el período</span>';
        }
        // El listado de sin calificar responde por qué, sin salir del briefing.
        const hayDetalle = _crSinCalificar.length > 0;
        card.disabled = !hayDetalle;
        card.title = hayDetalle
            ? 'Ver los clientes sin información suficiente para calificar'
            : 'Sin clientes para evaluar en el período';
        verTodos.hidden = !hayDetalle;
        verTodos.textContent = 'Ver detalle →';
        wrap.classList.remove('hidden');
        return;
    }

    const coberturaTxt = `${calificados} de ${totalClientes} cliente`
                       + `${totalClientes !== 1 ? 's' : ''} calificado${totalClientes !== 1 ? 's' : ''}`;

    // ESTADO 2 — Hay clientes calificados y ninguno bajo el umbral: verde, con
    // la cobertura a la vista para que el verde se lea con su alcance.
    if (!total || !top.length) {
        const hayDetalle = _crSinCalificar.length > 0;
        card.classList.add('cr-card-ok');
        card.disabled = !hayDetalle;
        card.title = hayDetalle
            ? `Ver clientes en estado Preliminar o sin calificar · ${coberturaTxt}`
            : `Ningún cliente por debajo del umbral de Estatus de Cliente · ${coberturaTxt}`;
        icono.textContent = '✅';
        titulo.innerHTML = 'Clientes en riesgo: <strong>0</strong>';
        verTodos.hidden = !hayDetalle;
        verTodos.textContent = 'Ver detalle →';
        resumen.innerHTML = '<span class="cr-vacio">Sin clientes por debajo del umbral</span>'
                          + '<span class="cr-sep">·</span>'
                          + `<span class="cr-sin-nota">${coberturaTxt}</span>`;
        wrap.classList.remove('hidden');
        return;
    }

    // ESTADO 3 — Hay clientes en riesgo.
    card.disabled = false;
    card.title = `Ver el listado completo de clientes en riesgo · ${coberturaTxt}`;
    icono.textContent = '⚠️';
    titulo.innerHTML = `Clientes en riesgo: <strong>${total}</strong>`;
    verTodos.hidden = false;
    verTodos.textContent = 'Ver todos →';
    resumen.innerHTML = top.map(c => {
        const scoreCls = c.color === 'rojo' ? 'cr-score-rojo' : 'cr-score-amarillo';
        return `<span class="cr-chip"><span class="cr-chip-name">${_esc(c.nombre)}</span>`
             + `<span class="cr-chip-score ${scoreCls}">${_crNota(c)}</span></span>`;
    }).join('<span class="cr-sep">·</span>');

    wrap.classList.remove('hidden');
}

function abrirClientesEnRiesgo() {
    // Sin clientes en riesgo la misma tarjeta abre el listado de los que no se
    // pudieron calificar: es la pregunta que deja abierta el estado gris.
    const sinRiesgo = !_crClientes.length;
    if (sinRiesgo && !_crSinCalificar.length) return;
    const titulo = sinRiesgo
        ? `⚪ Clientes sin calificar: ${_crSinCalificar.length}`
        : `⚠️ Clientes en riesgo: ${_crClientes.length}`;
    const subtitulo = sinRiesgo
        ? 'Sin información suficiente para calificar en el período — de mayor a menor cobertura de ejes. Se califica con 3 de 4 ejes con datos (con 2 ejes el estado es Preliminar)'
        : 'Por debajo del umbral de Estatus de Cliente, de menor a mayor calificación — toca uno para ver su detalle';
    const filas = sinRiesgo
        ? _crSinCalificar.map(_crSinItemHtml).join('')
        : _crClientes.map(_crItemHtml).join('');
    const modal = document.createElement('div');
    modal.className = 'sg-modal-overlay';
    modal.innerHTML = `
        <div class="sg-modal sg-modal-wide">
            <div class="sg-modal-title">${titulo}</div>
            <div class="sg-modal-sub">${subtitulo}</div>
            <div class="cr-items">${filas}</div>
            <a href="/dashboard/gestion/" class="cr-all-link" style="margin:1rem 0 0">Consultar listado en Gestión →</a>
            <button onclick="this.closest('.sg-modal-overlay').remove()"
                style="margin-top:1.25rem;width:100%;padding:.625rem;background:#0f172a;color:#fff;border:none;border-radius:.5rem;font-weight:600;cursor:pointer;font-size:.875rem">

            </button>

// ── Semáforo global ───────────────────────────────────────────────────────────

function computeSemaforo(alertasData, kpis, thr) {
    thr = thr || _thresholds || {};
    const rojas    = alertasData.filter(a => a.color_semaforo === 'rojo').length;
    const naranjas = alertasData.filter(a => a.color_semaforo === 'naranja').length;
    const amarillas = alertasData.filter(a => a.color_semaforo === 'amarillo').length;

    const incAb   = kpis.inc_abiertos    ?? 0;
    const supComp = kpis.sup_completadas ?? 0;
    const supProg = kpis.sup_programadas ?? 0;
    // Misma base que la tarjeta "Equipos": si viene el desglose por tipo, el
    // semáforo evalúa el inventario de radios (sin mezclar cámaras o alarmas) y
    // usa los umbrales configurables eq_verde_max / eq_amarillo_max.
    const tienePorTipo = kpis.eq_por_tipo && typeof kpis.eq_por_tipo === 'object';
    const radioSem = tienePorTipo ? _eqTipo(kpis.eq_por_tipo, 'radio', 'radios') : null;
    const eqTotal = tienePorTipo ? (radioSem?.total ?? 0) : (kpis.eq_total ?? 0);
    const eqNoOp  = tienePorTipo
        ? Math.max(0, eqTotal - (radioSem?.operativos ?? 0))
        : (kpis.eq_no_op ?? 0);
    const certProx = kpis.cert_proximas  ?? 0;
    const compVencidos  = kpis.comp_vencidos   ?? 0;
    const compPorVencer = kpis.comp_por_vencer ?? 0;
    const visitaComp = kpis.visita_completadas ?? 0;
    const visitaProg = kpis.visita_programadas ?? 0;
    const visitaEsperadas = kpis.visita_esperadas_hoy ?? visitaProg;

    const supVerdeMin    = thr.supervision_verde_min    ?? 90;
    const supAmarilloMin = thr.supervision_amarillo_min ?? 70;
    const eqVerdeMax     = thr.eq_verde_max             ?? 5;
    const eqAmarilloMax  = thr.eq_amarillo_max          ?? 15;
    const visitaVerdeMin    = thr.visita_verde_min    ?? 90;
    const visitaAmarilloMin = thr.visita_amarillo_min ?? 70;

    const supPct  = (kpis.sup_pct !== null && kpis.sup_pct !== undefined) ? kpis.sup_pct
                  : (supProg > 0 ? (supComp / supProg * 100) : 100);
    const eqNoPct = eqTotal > 0 ? (eqNoOp / eqTotal * 100) : 0;
    const visitaPct = (kpis.visita_pct !== null && kpis.visita_pct !== undefined)
                    ? kpis.visita_pct
                    : (visitaEsperadas > 0 ? (visitaComp / visitaEsperadas * 100) : 100);

    const condiciones = [];

    if (rojas >= 1)
        condiciones.push({ nivel:'rojo', texto:`${rojas} alerta${rojas!==1?'s':''} crítica${rojas!==1?'s':''} activa${rojas!==1?'s':''}` });
    if (supProg > 0 && supPct < supAmarilloMin)
        condiciones.push({ nivel:'rojo', texto:`Supervisiones: ${supComp} de ${supProg} completadas (${Math.round(supPct)}% < ${supAmarilloMin}%)` });
    if (incAb >= 3)
        condiciones.push({ nivel:'rojo', texto:`${incAb} incidentes abiertos (umbral ≥ 3)` });
    if (eqTotal > 0 && eqNoPct > eqAmarilloMax)
        condiciones.push({ nivel:'rojo', texto:`${eqNoOp} equipo${eqNoOp!==1?'s':''} no operativo${eqNoOp!==1?'s':''} (${Math.round(eqNoPct)}% > ${eqAmarilloMax}%)` });
    if (compVencidos >= 1)
        condiciones.push({ nivel:'rojo', texto:`${compVencidos} compromiso${compVencidos!==1?'s':''} de visita vencido${compVencidos!==1?'s':''}` });

    const esRojo = condiciones.some(c => c.nivel === 'rojo');

    if (!esRojo) {
        // Las prioritarias (naranja) pesan como atención en el semáforo global:
        // piden gestión pronta, no declaran la operación en alerta crítica.
        if (naranjas >= 1)
            condiciones.push({ nivel:'amarillo', texto:`${naranjas} alerta${naranjas!==1?'s':''} prioritaria${naranjas!==1?'s':''}` });
        if (amarillas >= 1)
            condiciones.push({ nivel:'amarillo', texto:`${amarillas} alerta${amarillas!==1?'s':''} requieren atención` });
        if (supProg > 0 && supPct >= supAmarilloMin && supPct < supVerdeMin)
            condiciones.push({ nivel:'amarillo', texto:`Supervisiones: ${Math.round(supPct)}% completadas (entre ${supAmarilloMin}% y ${supVerdeMin - 1}%)` });
        if (incAb === 1 || incAb === 2)
            condiciones.push({ nivel:'amarillo', texto:`${incAb} incidente${incAb!==1?'s':''} abierto${incAb!==1?'s':''}` });
        if (eqTotal > 0 && eqNoPct > eqVerdeMax && eqNoPct <= eqAmarilloMax)
            condiciones.push({ nivel:'amarillo', texto:`${eqNoOp} equipo${eqNoOp!==1?'s':''} no operativo${eqNoOp!==1?'s':''} (${Math.round(eqNoPct)}% entre ${eqVerdeMax}% y ${eqAmarilloMax}%)` });
        if (certProx >= 1)
            condiciones.push({ nivel:'amarillo', texto:`${certProx} ${certProx!==1?'certificaciones':'certificación'} por vencer en 30 días` });
        if (compPorVencer >= 1)
            condiciones.push({ nivel:'amarillo', texto:`${compPorVencer} compromiso${compPorVencer!==1?'s':''} de visita próximo${compPorVencer!==1?'s':''} a vencer` });
        if (visitaProg > 0 && visitaEsperadas > 0 && visitaPct < visitaVerdeMin)
            condiciones.push({ nivel:'amarillo', texto:`Visitas a clientes: ${visitaComp} de ${visitaEsperadas} esperadas a ayer (meta: ${visitaProg})` });
    }

    const esAmarillo = !esRojo && condiciones.some(c => c.nivel === 'amarillo');
    const nivel = esRojo ? 'rojo' : esAmarillo ? 'amarillo' : 'verde';
    return { nivel, condiciones };
}

function renderSemaforo(alertasData, kpis) {
    const { nivel, condiciones } = computeSemaforo(alertasData, kpis);

    document.getElementById('semaforoSkeleton').classList.add('hidden');
    const el = document.getElementById('semaforoGlobal');
    el.className = `semaforo-global sg-${nivel}`;
    el.classList.remove('hidden');

    document.getElementById('sgLuzRojo').className    = `sg-luz sg-luz-rojo${nivel==='rojo'?' activo':''}`;
    document.getElementById('sgLuzAmarillo').className = `sg-luz sg-luz-amarillo${nivel==='amarillo'?' activo':''}`;
    document.getElementById('sgLuzVerde').className   = `sg-luz sg-luz-verde${nivel==='verde'?' activo':''}`;

    const textos = { rojo:'ALERTA CRÍTICA', amarillo:'ATENCIÓN REQUERIDA', verde:'BAJO CONTROL' };
    document.getElementById('sgEstado').textContent = textos[nivel];

    const total = alertasData.length;
    const ts = new Date().toLocaleTimeString('es', { hour:'2-digit', minute:'2-digit' });
    document.getElementById('sgMeta').textContent =
        `${total} alerta${total!==1?'s':''} activa${total!==1?'s':''} — última actualización ${ts}`;

    const activasCond = condiciones.filter(c => c.nivel === nivel).length;
    document.getElementById('sgHint').textContent = nivel === 'verde'
        ? 'Toca para ver el detalle de condiciones evaluadas'
        : `${activasCond} ${activasCond!==1?'condiciones':'condición'} activando este estado — toca para ver`;
}

    { key: 'reporte_incidente',            titulo: 'Incidentes abiertos' },
    { key: 'estatus_cliente',              titulo: 'Clientes en riesgo (Estatus de Cliente)' },
    { key: 'supervision_puesto',           titulo: 'Supervisiones pendientes o no realizadas' },
    { key: 'checklist_cumplimiento',        titulo: 'Certificaciones vencidas o próximas a vencer' },

    { key: 'medicion_experiencia_cliente', titulo: 'Encuestas de satisfacción con novedades' },

];

function _sgGrupoHtml(titulo, items) {
    const body = items.length
        ? `<div class="sg-detail-list">${items.map(_alertaItemHtml).join('')}</div>`
        : `<div class="sg-detail-empty">Sin novedades en esta categoría.</div>`;
    return `<div class="sg-detail-section">
        <div class="sg-detail-heading">${titulo}</div>
        ${body}
    </div>`;
}

function _csrfToken() {
    const row = document.cookie.split(';').map(c => c.trim())
        .find(c => c.startsWith('csrf_access_token='));
    return row ? decodeURIComponent(row.substring('csrf_access_token='.length)) : '';
}

// Fila de un hallazgo asignado: el mismo ítem que las demás alertas —de ahí que
// la visualización sea idéntica a la de los incidentes asignados— más el botón
// que lo saca de pendientes.
function _asignadoRowHtml(a) {
    return `<div class="sg-asig-row" data-asignacion="${a.asignacion_id}">
        ${_alertaItemHtml(a)}
        <button class="btn-gestionar" onclick="gestionarAsignacion(${a.asignacion_id}, this)"
                title="Marcar como gestionado y archivar en historial">✓ Gestionar</button>
    </div>`;
}

async function gestionarAsignacion(asignacionId, btn) {
    if (!confirm('¿Marcar este hallazgo como gestionado? Se guardará en su historial y saldrá de la lista de pendientes.')) return;
    btn.disabled = true;
    btn.textContent = 'Guardando…';
    try {
        const res = await fetch(`/cgeo/api/asignaciones/${asignacionId}/gestionar`, {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json', 'X-CSRF-TOKEN': _csrfToken() },
            body: JSON.stringify({}),
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'No se pudo gestionar.');

        // Fuera de la lista local para que el semáforo se recalcule sin recargar.
        _alertasData = _alertasData.filter(a => a.asignacion_id !== asignacionId);
        renderSemaforo(_alertasData, _kpis);
        renderAlertas(_alertasData);

        // Feedback visual inmediato: el ítem no desaparece bruscamente, sino que
        // se transforma en estado gestionado confirmado para dar certeza de dónde quedó.
        const fila = document.querySelector(`.sg-asig-row[data-asignacion="${asignacionId}"]`);
        if (fila) {
            fila.style.transition = 'all 0.3s ease';
            fila.style.background = 'rgba(34, 197, 94, 0.12)';
            fila.style.borderLeft = '3px solid #22c55e';
            const alertaLink = fila.querySelector('.alerta-item');
            if (alertaLink) {
                alertaLink.style.opacity = '0.85';
            }
            btn.outerHTML = `<div style="display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:0 .75rem;flex-shrink:0;">
                <span style="display:inline-flex;align-items:center;gap:.25rem;padding:.2rem .55rem;background:#15803d;color:#fff;border-radius:999px;font-size:.72rem;font-weight:700;">
                    ✓ Gestionado
                </span>
                <span style="font-size:.68rem;color:#16a34a;margin-top:.2rem;font-weight:600;">
                    Archivado en historial
                </span>
            </div>`;

            // Actualizar contador del encabezado
            const heading = document.getElementById('sgAsigHeading');
            if (heading) {
                const restAsig = _alertasData.filter(a => a.asignacion);
                const venc = restAsig.filter(a => a.vencida).length;
                heading.innerHTML = `📌 HALLAZGOS ASIGNADOS${
                    restAsig.length
                        ? ` <span style="font-weight:600;text-transform:none;letter-spacing:0">— ${restAsig.length} pendiente${restAsig.length !== 1 ? 's' : ''}${venc ? `, ${venc} vencido${venc !== 1 ? 's' : ''}` : ''}</span>`
                        : ' <span style="font-weight:600;text-transform:none;letter-spacing:0;color:#16a34a;">— Todos gestionados ✓</span>'
                }`;
            }
        }
    } catch (err) {
        btn.disabled = false;
        btn.textContent = '✓ Gestionar';
        alert(err.message);
    }
}

async function abrirDetalleSemaforo() {
    if (!_kpis) return;
    const { nivel } = computeSemaforo(_alertasData, _kpis);
    const textos = { rojo:'ALERTA CRÍTICA', amarillo:'ATENCIÓN REQUERIDA', verde:'BAJO CONTROL' };
    const ts = new Date().toLocaleTimeString('es', { hour:'2-digit', minute:'2-digit' });

    // Las asignaciones van en su propia sección arriba y se excluyen de los
    // grupos por tipo, o el mismo hallazgo aparecería dos veces en la ventana.
    const asignados = _alertasData.filter(a => a.asignacion);
    const restantes = _alertasData.filter(a => !a.asignacion);

    const porTipo = {};
    for (const g of _SG_GRUPOS) porTipo[g.key] = [];
    for (const a of restantes) {
        const key = a.backup ? '__backup__'
            : (a.form_type === 'registro_y_acta_de_visita' || a.ruta_navegacion === '/dashboard/visitas/')
            ? 'registro_y_acta_de_visita'
            : (_SG_GRUPOS.some(g => g.key === a.form_type) ? a.form_type : '__otros__');
        porTipo[key].push(a);
    }

    const vencidos = asignados.filter(a => a.vencida).length;
    const asignadosHtml = `<div class="sg-asignados">
        <div class="sg-detail-heading" id="sgAsigHeading">📌 HALLAZGOS ASIGNADOS${
            asignados.length ? ` <span style="font-weight:600;text-transform:none;letter-spacing:0">— ${asignados.length} pendiente${asignados.length !== 1 ? 's' : ''}${vencidos ? `, ${vencidos} vencido${vencidos !== 1 ? 's' : ''}` : ''}</span>` : ''
        }</div>
        ${asignados.length
            ? `<div class="sg-detail-list">${asignados.map(_asignadoRowHtml).join('')}</div>`
            : `<div class="sg-detail-empty">Sin hallazgos asignados pendientes de gestión.</div>`}
        <div style="padding:.4rem 0 .2rem;text-align:right;">
            <a href="/cgeo/hallazgos" target="_blank" style="font-size:.75rem;font-weight:600;color:#38bdf8;text-decoration:none;">
                📁 Consultar historial de hallazgos gestionados →
            </a>
        </div>
    </div>`;

    const gruposHtml = asignadosHtml + _SG_GRUPOS.map(g => _sgGrupoHtml(g.titulo, porTipo[g.key])).join('');

    const modal = document.createElement('div');
    modal.className = 'sg-modal-overlay';
    modal.innerHTML = `
        <div class="sg-modal sg-modal-wide">
            <div class="sg-modal-title">Estado: ${textos[nivel]}</div>
            <div class="sg-modal-sub">Detalle de novedades al ${ts} — toca un registro para ver el detalle o gestionarlo</div>
            ${gruposHtml}
            <button onclick="this.closest('.sg-modal-overlay').remove()"
                style="margin-top:1.25rem;width:100%;padding:.625rem;background:#0f172a;color:#fff;border:none;border-radius:.5rem;font-weight:600;cursor:pointer;font-size:.875rem">
                Cerrar
            </button>
        </div>`;
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
}

const MAX_ALERTAS = 5;

// One viewer instance per form_type, created lazily
const _alertViewers = {};
function _getAlertViewer(formType) {
    if (!_alertViewers[formType]) {
        const titles = {
            'reporte_incidente':       'Reporte de Incidente',
            'supervision_puesto':      'Detalle de Supervisión',
            'checklist_cumplimiento':  'Detalle de Cumplimiento',
            'medicion_experiencia_cliente': 'Detalle de Encuesta de Satisfacción',
            'registro_y_acta_de_visita': 'Detalle de Visita y Compromisos',
            'confiabilidad_equipos':    'Detalle de Confiabilidad de Equipos',
            'informe_novedades_disciplinario': 'Detalle de Informe Disciplinario',
            'planilla_vehicular':       'Detalle de Pre-operacional de Vehículo',
            'planilla_motocicletas':    'Detalle de Pre-operacional de Motocicleta',
        };
        _alertViewers[formType] = createDashboardRecordViewer({
            formType,
            recordTitle: titles[formType] || 'Detalle del Registro',
        });
    }
    return _alertViewers[formType];
}

// Para alertas sin registro asociado (nada se ha registrado todavía): se informa
// dentro del propio Morning Briefing en vez de salir hacia el módulo.
// Alerta de seguridad de acceso (regla 15): no hay registro operativo que
// abrir. Se muestra la ficha con el formato de auditoría y se puede marcar como
// revisada; la fila queda en alertas_seguridad como constancia.
function abrirAlertaSeguridad(a) {
    const modal = document.createElement('div');
    modal.className = 'sg-modal-overlay';
    const fila = (k, v) => `<div style="display:flex;justify-content:space-between;gap:1rem;padding:.3rem 0;border-bottom:1px solid rgba(148,163,184,.25)">
            <span style="color:#94a3b8">${k}</span><strong style="text-align:right;word-break:break-all">${_esc(v)}</strong></div>`;
    const dispositivos = (a.dispositivos || []).map((d, i) => fila(`Dispositivo ${i + 1}:`, d)).join('');
    modal.innerHTML = `
        <div class="sg-modal">
            <div class="sg-modal-title">🔴 USUARIO CON SESIONES SIMULTÁNEAS</div>
            <div class="sg-modal-sub">Dos o más sesiones iniciaron con las mismas credenciales.</div>
            <div class="drv-5q-card" style="border-radius:.6rem;padding:.75rem;margin-bottom:.5rem;font-size:.85rem">
                ${fila('Usuario:', a.usuario || '')}
                ${fila('Sesiones activas:', String(a.sesiones_activas || ''))}
                ${dispositivos}
                ${fila('Fecha y hora:', a.fecha_hora || '')}
                ${fila('Estado:', a.estado_seguridad || '')}
            </div>
            <div class="sg-detail-empty">Confirma con el usuario si ambas sesiones son suyas. Si no lo son,
                cambia su contraseña desde el panel de administración. Al marcarla como revisada la alerta
                sale del panel, pero el registro se conserva.</div>
            <button id="segRevisarBtn" class="alerta-btn alerta-btn-rojo"
                style="display:block;width:100%;text-align:center;margin-top:1.25rem;padding:.625rem;border:none;cursor:pointer;font-size:.875rem">
                Marcar como revisada
            </button>
            <button onclick="this.closest('.sg-modal-overlay').remove()"
                style="margin-top:.75rem;width:100%;padding:.625rem;background:#0f172a;color:#fff;border:none;border-radius:.5rem;font-weight:600;cursor:pointer;font-size:.875rem">
                Cerrar
            </button>
        </div>`;
    modal.querySelector('#segRevisarBtn').addEventListener('click', async function () {
        const btn = this;
        btn.disabled = true;
        btn.textContent = 'Guardando…';
        try {
            const res = await fetch(`/cgeo/api/alertas-seguridad/${a.alerta_seguridad_id}/revisar`, {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json', 'X-CSRF-TOKEN': _csrfToken() },
                body: '{}'
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.success) throw new Error(data.error || 'No se pudo marcar como revisada.');
            modal.remove();
            // Fuera de la lista local para que el semáforo se recalcule sin recargar.
            _alertasData = _alertasData.filter(x => x.id !== a.id);
            renderSemaforo(_alertasData, _kpis);
            renderAlertas(_alertasData);
        } catch (err) {
            btn.disabled = false;
            btn.textContent = 'Marcar como revisada';
            alert(err.message);
        }
    });
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
}

function abrirAlertaSinRegistro(a) {
    const modal = document.createElement('div');
    modal.className = 'sg-modal-overlay';
    modal.innerHTML = `
        <div class="sg-modal">
