async function downloadBriefingPdf() {
    const btn = document.getElementById('btnBriefingPdf');
    if (!_kpis) { alert('Los datos aún no han cargado. Espera un momento e intenta de nuevo.'); return; }

    const originalText = btn.textContent;
    btn.textContent = 'Generando PDF…';
    btn.disabled = true;

    try {
        const chartImg = _chart ? document.getElementById('chartTendencia')?.toDataURL('image/png') : null;
        const semaforo = computeSemaforo(_alertasData, _kpis);
        const cliente  = new URLSearchParams(window.location.search).get('cliente') || 'Todos los clientes';

        const res = await fetch('/cgeo/api/morning-briefing-pdf', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json', 'X-CSRF-TOKEN': _csrfToken() },
            body: JSON.stringify({
                kpis:        _kpis,
                alertas:     _alertasData,
                semaforo,
                thresholds:  _thresholds,
                tendencia:   { labels: _tendencia.map(d => d.label), supervisiones: _tendencia.map(d => d.completadas ?? 0), programadas: _tendencia.map(d => d.programadas ?? 0) },
                chart_image: chartImg,
                cliente,
            }),
        });

        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            alert(err.error || 'Error generando el PDF.');
            return;
        }

        const blob = await res.blob();
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        const today = new Date().toISOString().slice(0, 10);
        a.href = url;
        a.download = `briefing_${today}.pdf`;
        a.click();
        URL.revokeObjectURL(url);
    } catch (err) {
        alert(`Error: ${err.message}`);
    } finally {
        btn.textContent = originalText;
        btn.disabled = false;
    }
}

const _alertaRegistry = [];
function _alertaRef(a) { _alertaRegistry.push(a); return _alertaRegistry.length - 1; }

function _esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Punto de entrada único de todas las alertas: con registro abre su detalle
// llevando el motivo; sin registro, la acción va a donde se pueda gestionar.
function abrirAlerta(ref, event) {
    const a = _alertaRegistry[ref];
    if (!a) return;   // sin preventDefault: que al menos siga el href
    event.preventDefault();
    if (a.seguridad) {
        abrirAlertaSeguridad(a);
        return;
    }
    if (a.backup || a.form_type === 'estatus_cliente') {
        window.location.href = a.ruta_navegacion;
        return;
    }
    if (a.record_id && a.form_type) {
        // Se lleva también la identidad del hallazgo: si desde aquí se asigna, la
        // asignación queda apuntando al ítem concreto y no al registro completo.
        _getAlertViewer(a.form_type).openRecord(a.record_id, {
            motivo: a.motivo || a.texto,
            hallazgoRef: a.id || '',
            hallazgoTitulo: a.hallazgo_titulo || a.texto || ''
        });
    } else {
        abrirAlertaSinRegistro(a);
    }
}

function _alertaItemHtml(a) {
    // Tres tonos: rojo (crítica), naranja (Prioritaria) y amarillo (atención).
    const color   = a.color_semaforo === 'rojo' ? 'rojo'
                  : a.color_semaforo === 'naranja' ? 'naranja'
                  : a.color_semaforo === 'verde' ? 'verde' : 'amarillo';
    const dotCls  = `alerta-dot-${color}`;
    const btnCls  = `alerta-btn-${color}`;
    const icon    = color === 'rojo' ? '🔴' : color === 'verde' ? '🟢' : color === 'naranja' ? '🟠' : '🟡';
    const ts      = _relTime(a.timestamp);

    const prioridadBadge = color === 'naranja'
        ? '<span class="alerta-prioridad-badge">Prioritaria</span>'
        : '';
    const estadoBadge = (a.estado && a.estado !== 'Abierto')
        ? `<span class="alerta-estado-badge"><span class="badge-estado">${_esc(a.estado)}</span>${a.responsable_asignado ? `<span class="badge-resp">· ${_esc(a.responsable_asignado)}</span>` : ''}</span>`
        : '';
    return `<a href="${_esc(a.ruta_navegacion)}" class="alerta-item"
               title="${_esc(a.motivo || a.texto)}"
               onclick="abrirAlerta(${_alertaRef(a)},event)">
        <div class="alerta-dot ${dotCls}"></div>
        <span style="font-size:.875rem;flex-shrink:0">${icon}</span>
        <span class="alerta-texto">${_esc(a.texto)}</span>
        ${prioridadBadge}
        ${estadoBadge}
        <span class="alerta-ts">${ts}</span>
        <span class="alerta-btn ${btnCls}">${_esc(a.accion)} →</span>
    </a>`;
}

let _rutinaExpanded = false;

function toggleRutinaExpanded() {
    _rutinaExpanded = !_rutinaExpanded;
    const el = document.getElementById('mbRutinaList');
    const arrow = document.getElementById('mbRutinaArrow');
    if (el) el.style.display = _rutinaExpanded ? 'block' : 'none';
    if (arrow) arrow.textContent = _rutinaExpanded ? '▲ Ocultar tareas' : '▼ Ver tareas';
}

function renderAlertas(alertas) {
    _alertaRegistry.length = 0;
    const cont = document.getElementById('alertasContainer');

    if (!alertas || !alertas.length) {
        cont.innerHTML = `
            <div class="alertas-empty">
                <div class="alertas-empty-icon">✅</div>
                <div class="alertas-empty-text">Operación sin pendientes críticos</div>
                <div class="alertas-empty-sub">Ninguna alerta activa en este momento · Operación bajo control</div>
            </div>`;
        return;
    }

    // Clasificación en los 3 Niveles Operativos
    const crisis = alertas.filter(a => a.nivel === 1 || a.color_semaforo === 'rojo' || a.regla === 19);
    const rutina = alertas.filter(a => a.nivel === 3 || [5, 7, 11, 13, 16].includes(a.regla) || a.backup);
    const preventivas = alertas.filter(a => !crisis.includes(a) && !rutina.includes(a));

    let html = '';

    // ── NIVEL 1: SALA DE CRISIS (Acción Inmediata) ───────────────────────────
    if (crisis.length > 0) {
        html += `
        <div class="mb-tier-card mb-tier-crisis">
            <div class="mb-tier-header mb-tier-header-crisis">
                <div class="mb-tier-title mb-tier-title-crisis">
                    <span>🚨</span> SALA DE CRISIS — Acción Inmediata
                </div>
                <span class="mb-tier-badge mb-tier-badge-crisis">${crisis.length} crítica${crisis.length !== 1 ? 's' : ''}</span>
            </div>
            <div class="alertas-list">
                ${crisis.map(_alertaItemHtml).join('')}
            </div>
        </div>`;
    } else {
        html += `
        <div class="mb-crisis-cero-card">
            <div class="mb-crisis-cero-icon">🟢</div>
            <div class="mb-crisis-cero-body">
                <div class="mb-crisis-cero-tit">Sala de Crisis: 0 emergencias activas</div>
                <div class="mb-crisis-cero-sub">Sin puestos caídos, armas vencidas ni incidentes desatendidos · Operación bajo control.</div>
            </div>
        </div>`;
    }

    // ── NIVEL 2: RADAR PREVENTIVO (Gestión para hoy) ─────────────────────────
    if (preventivas.length > 0) {
        html += `
        <div class="mb-tier-card mb-tier-preventivo">
            <div class="mb-tier-header mb-tier-header-preventivo">
                <div class="mb-tier-title mb-tier-title-preventivo">
                    <span>🛡️</span> RADAR PREVENTIVO — Gestión para hoy
                </div>
                <span class="mb-tier-badge mb-tier-badge-preventivo">${preventivas.length} por atender</span>
            </div>
            <div class="alertas-list">
                ${preventivas.map(_alertaItemHtml).join('')}
            </div>
        </div>`;
    } else {
        html += `
        <div class="mb-tier-card mb-tier-preventivo">
            <div class="mb-tier-header mb-tier-header-preventivo">
                <div class="mb-tier-title mb-tier-title-preventivo">
                    <span>🛡️</span> RADAR PREVENTIVO — Gestión para hoy
                </div>
                <span class="mb-tier-badge mb-tier-badge-preventivo">0 pendientes</span>
            </div>
            <div style="padding:.875rem 1.25rem;font-size:.8rem;color:#64748b;">
                Sin alertas preventivas pendientes de gestión hoy.
            </div>
        </div>`;
    }

    // ── NIVEL 3: SEGUIMIENTO DE TURNO (Rutina cíclica) ────────────────────────
    if (rutina.length > 0) {
        html += `
        <div class="mb-tier-card mb-tier-rutina">
            <button type="button" class="mb-rutina-btn-toggle" onclick="toggleRutinaExpanded()">
                <span class="mb-rutina-title">
                    <span>📋</span> SEGUIMIENTO DE TURNO — ${rutina.length} tarea${rutina.length !== 1 ? 's' : ''} cíclica${rutina.length !== 1 ? 's' : ''} (checklists SST, revisiones periódicas)
                </span>
                <span class="mb-rutina-arrow" id="mbRutinaArrow">${_rutinaExpanded ? '▲ Ocultar tareas' : '▼ Ver tareas'}</span>
            </button>
            <div class="alertas-list" id="mbRutinaList" style="${_rutinaExpanded ? '' : 'display:none;'}">
                ${rutina.map(_alertaItemHtml).join('')}
            </div>
        </div>`;
    }

    cont.innerHTML = html;
}

// ── Tendencia chart ───────────────────────────────────────────────────────────

function renderTendencia(tendencia, kpis) {
    document.getElementById('chartSkeleton').style.display = 'none';
    // Título con las fechas, cuota diaria en la leyenda y nota con la suma de la
    // tarjeta: sólo etiquetas; las series no cambian.
    const k = kpis || {};
    const tit = document.getElementById('tendenciaTitulo');
    if (tit) tit.textContent = 'Supervisiones por día' + (k.sup_periodo_label ? ` · ${k.sup_periodo_label}` : '');
    const progLbl = document.getElementById('tendenciaProgLbl');
    if (progLbl) progLbl.textContent = (k.sup_programadas_dia !== null && k.sup_programadas_dia !== undefined && kpis)
        ? `Programadas por día: ${_fmtCuota(k.sup_programadas_dia)}` : 'Programadas por día';
    const nota = document.getElementById('tendenciaNota');
    if (nota) nota.textContent = kpis ? _notaTendencia(k) : '';
    const canvas = document.getElementById('chartTendencia');
    canvas.style.display = '';

    if (_chart) { _chart.destroy(); _chart = null; }

    const dark = _isDark();
    const gridColor = dark ? 'rgba(255,255,255,.07)' : 'rgba(0,0,0,.06)';
    const tickColor = dark ? '#64748b' : '#94a3b8';

    _chart = new Chart(canvas, {
        type: 'line',
        data: {
            labels: tendencia.map(d => d.label),
            datasets: [
                {
                    label: 'Realizadas (sin tope)',
                    data: tendencia.map(d => d.completadas),
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59,130,246,.1)',
                    borderWidth: 2.5,
                    pointRadius: 4,
                    pointBackgroundColor: '#3b82f6',
                    tension: .3,
                    fill: true,
                },
                {
                    label: 'Programadas por día',
                    data: tendencia.map(d => d.programadas),
                    borderColor: '#cbd5e1',
                    borderWidth: 2,
                    borderDash: [5, 4],
                    pointRadius: 0,
                    tension: 0,
                    fill: false,
                },
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
            scales: {
                x: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 11 } } },
                y: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 11 }, precision: 0 } },
            },
        }
    });
}

// ── Carga de datos en paralelo ────────────────────────────────────────────────

async function loadAll(silent = false) {
    if (!silent) {
        document.getElementById('refreshDot').className = 'auto-refresh-dot updating';
        document.getElementById('refreshLabel').textContent = 'Actualizando…';
    }

    try {
        const [briefingResp, alertasResp] = await Promise.all([
            fetch('/cgeo/api/morning-briefing-data', { headers: { Accept: 'application/json' } }),
            fetch('/cgeo/api/alertas',               { headers: { Accept: 'application/json' } }),
        ]);

        if (briefingResp.ok) {
            const briefing = await briefingResp.json();
            _kpis        = briefing.kpis;
            _tendencia   = briefing.tendencia_semana || [];
            _thresholds  = briefing.thresholds || {};
            renderKpis(_kpis, briefing.thresholds);
            renderClientesEnRiesgo(briefing.clientes_en_riesgo);
            renderTendencia(_tendencia, _kpis);
        } else {
            console.warn('morning-briefing-data error status:', briefingResp.status);
        }

        if (alertasResp.ok) {
            const alertasData = await alertasResp.json();
            _alertasData = alertasData.alertas || [];
            renderSemaforo(_alertasData, _kpis);
            renderAlertas(_alertasData);
        } else {
            console.warn('alertas error status:', alertasResp.status);
            renderSemaforo([], _kpis);
            renderAlertas([]);
        }

    } catch (err) {
        console.error('loadAll error:', err);
    } finally {
        document.getElementById('refreshDot').className = 'auto-refresh-dot';
        document.getElementById('refreshLabel').textContent = `Actualizado ${new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}`;
    }
}

function _startAutoRefresh() {
    if (_refreshTimer) clearInterval(_refreshTimer);
    _refreshTimer = setInterval(() => loadAll(true), 5 * 60 * 1000);
}

// ── Sidebar toggle ────────────────────────────────────────────────────────────

document.addEventListener('DOMContentLoaded', () => {
    loadAll();
    _startAutoRefresh();
});
